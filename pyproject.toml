[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuity-ai"
version = "0.3.0"
description = "Persistent project continuity for coding agents: memory, code orientation, checkpoints, and handoffs."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "KingJu1c3"}]
keywords = ["ai", "agents", "memory", "claude-code", "codex", "context", "handoff"]

[project.scripts]
continuity = "continuity.cli:main"

[tool.setuptools.packages.find]
include = ["continuity*"]

[tool.setuptools.package-data]
continuity = ["SKILL.md", "protocol/*.md", "schemas/*.json"]
