name: Assemble verified upstream source bundle
on:
  workflow_dispatch:
  push:
    branches: [continuity-v0.2-build]
permissions:
  contents: read
concurrency:
  group: bundle-sources-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify exact pinned sources
        run: python scripts/fetch_sources.py --destination "$RUNNER_TEMP/continuity-sources" --execute
      - name: Assemble complete distribution
        run: |
          python scripts/build_repository.py --source-root "$RUNNER_TEMP/continuity-sources" --destination "$RUNNER_TEMP/continuity-complete"
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          source = Path(os.environ['RUNNER_TEMP']) / 'continuity-complete' / 'vendor'
          shutil.copytree(source, Path('vendor'), dirs_exist_ok=True)
          PY
      - name: Verify before committing
        run: |
          python -m unittest discover -s tests -v
          python scripts/vendor_sources.py
      - name: Commit verified source files to this branch
        env:
          CONTINUITY_BRANCH: ${{ github.ref_name }}
        run: |
          git add -f vendor
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bundle verified pinned sources for Continuity'
          git push origin "HEAD:$CONTINUITY_BRANCH"
