name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q continuity
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          HOME="$RUNNER_TEMP/home" PYTHONPATH=. python -m continuity --path . index
          HOME="$RUNNER_TEMP/home" PYTHONPATH=. python -m continuity --path . doctor
