name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q continuity
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Install packaged project
        run: python -m pip install --no-deps .
      - name: Verify packaged protocol bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import continuity
          root = Path(continuity.__file__).resolve().parent
          assert (root / "SKILL.md").is_file()
          assert (root / "protocol" / "session-open.md").is_file()
          assert (root / "schemas" / "checkpoint.schema.json").is_file()
          PY
      - name: CLI smoke test
        run: |
          HOME="$RUNNER_TEMP/home" continuity --path . index
          HOME="$RUNNER_TEMP/home" continuity --path . doctor
